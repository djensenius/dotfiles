---
name: 'Lint Shell Scripts'
on:  # yamllint disable-line rule:truthy
  - pull_request
jobs:
  shellcheck:
    name: 'Shellcheck'
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v4
      - name: 'Shellcheck'
        uses: ludeeus/action-shellcheck@master
      - name: 'Test Herdr cache snapshot'
        run: herdr/tests/herdr-cli-update-test.sh
      - name: 'Test macOS bootstrap'
        run: |
          mac/tests/brewfile-mise-lint.sh
          mac/tests/install-mac-test.sh
