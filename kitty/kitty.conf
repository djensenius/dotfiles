# Kitty terminal configuration
# Mirrors rio/config.toml and wezterm/wezterm.lua:
#   - Catppuccin Mocha with an OLED-friendly pure-black background
#   - Monaspace Neon/Xenon/Radon/Krypton faces with Nerd Font symbols
#   - 120x40 startup size, 10pt vertical padding, and top tabs when needed

# Fonts
font_family      family="Monaspace Neon Var" style=Light features="+calt +liga +dlig +ss01 +ss02 +ss03 +ss04 +ss05 +ss06 +ss09"
bold_font        family="Monaspace Xenon Var" style=Bold features="+calt +liga +dlig +ss01 +ss02 +ss03 +ss04 +ss05 +ss06 +ss09"
italic_font      family="Monaspace Radon Var" style=Italic features="+calt +liga +dlig +ss01 +ss02 +ss03 +ss04 +ss05 +ss06 +ss09"
bold_italic_font family="Monaspace Krypton Var" style="Bold Italic" features="+calt +liga +dlig +ss01 +ss02 +ss03 +ss04 +ss05 +ss06 +ss09"
font_size 15.0
modify_font cell_height 120%
disable_ligatures never
include nerdfont.conf

# History and alerts
scrollback_lines 10000
enable_audio_bell no
visual_bell_duration 0
window_alert_on_bell no
bell_on_tab no

# Window
remember_window_size no
initial_window_width 120c
initial_window_height 40c
window_padding_width 10 0 10 0
background_opacity 1.0
background_blur 0
confirm_os_window_close 0

# Tabs
tab_bar_edge top
tab_bar_style separator
tab_separator ""
tab_bar_min_tabs 2
tab_bar_align left
tab_title_template " {title} "
active_tab_title_template " {title} "
active_tab_font_style bold
inactive_tab_font_style normal

# macOS
macos_option_as_alt left
macos_titlebar_color #040404
macos_show_window_title_in none
macos_quit_when_last_window_closed no

# Catppuccin Mocha with the same OLED overrides as Rio and WezTerm
foreground              #CDD6F4
background              #000000
selection_foreground    #CDD6F4
selection_background    #585B70

cursor                  #F5E0DC
cursor_text_color       #1E1E2E
url_color               #F5E0DC

active_border_color     #B4BEFE
inactive_border_color   #6C7086
bell_border_color       #F9E2AF

active_tab_foreground   #CDD6F4
active_tab_background   #040404
inactive_tab_foreground #BAC2DE
inactive_tab_background #0F0F0F
tab_bar_background      #040404

color0  #45475A
color1  #F38BA8
color2  #A6E3A1
color3  #F9E2AF
color4  #89B4FA
color5  #F5C2E7
color6  #94E2D5
color7  #BAC2DE
color8  #585B70
color9  #F38BA8
color10 #A6E3A1
color11 #F9E2AF
color12 #89B4FA
color13 #F5C2E7
color14 #94E2D5
color15 #A6ADC8
